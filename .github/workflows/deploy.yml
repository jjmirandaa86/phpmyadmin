name: CI/CD Deploy phpMyAdmin

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      PMA_IMAGE: phpmyadmin/phpmyadmin:latest
      PMA_DOMAIN: phpmyadmin.acertijo.dev
      PMA_PORT: 8081
      ENV_FILE: /app/phpmyadmin/.env

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Sync .env from GitHub secret to server
        env:
          PHPMYADMIN_ENV: ${{ secrets.PHPMYADMIN_ENV }}
        run: |
          if [ -z "$PHPMYADMIN_ENV" ]; then
            echo "❌ Falta el secret PHPMYADMIN_ENV"
            echo "GitHub → Settings → Secrets → Actions → New repository secret"
            echo "Pega el contenido completo de tu archivo .env local"
            exit 1
          fi

          printf '%s\n' "$PHPMYADMIN_ENV" > /tmp/phpmyadmin.env

          ssh -i ~/.ssh/id_rsa root@${{ secrets.SERVER_IP }} "mkdir -p /app/phpmyadmin"

          scp -i ~/.ssh/id_rsa /tmp/phpmyadmin.env root@${{ secrets.SERVER_IP }}:/app/phpmyadmin/.env

          ssh -i ~/.ssh/id_rsa root@${{ secrets.SERVER_IP }} "chmod 600 /app/phpmyadmin/.env"

          rm -f /tmp/phpmyadmin.env

          echo "✅ .env sincronizado en el servidor"

      - name: Deploy phpMyAdmin container
        run: |
          ssh -i ~/.ssh/id_rsa root@${{ secrets.SERVER_IP }} << EOF
            set -e

            PMA_IMAGE="${PMA_IMAGE}"
            PMA_DOMAIN="${PMA_DOMAIN}"
            PMA_PORT="${PMA_PORT}"
            ENV_FILE="${ENV_FILE}"

            echo "========================================"
            echo "1. Validar archivo .env"
            echo "========================================"
            if [ ! -f "\$ENV_FILE" ]; then
              echo "❌ No existe \$ENV_FILE"
              exit 1
            fi

            echo "========================================"
            echo "2. Red Docker app_network"
            echo "========================================"
            docker network inspect app_network >/dev/null 2>&1 || docker network create app_network

            echo "========================================"
            echo "3. Descargar imagen phpMyAdmin"
            echo "========================================"
            docker pull "\$PMA_IMAGE"

            echo "========================================"
            echo "4. Contenedor phpMyAdmin"
            echo "========================================"
            docker stop phpmyadmin || true
            docker rm phpmyadmin || true

            docker run -d \
              --name phpmyadmin \
              --network app_network \
              --restart unless-stopped \
              --env-file "\$ENV_FILE" \
              -e PMA_ABSOLUTE_URI=https://\${PMA_DOMAIN}/ \
              -p 127.0.0.1:\${PMA_PORT}:80 \
              "\$PMA_IMAGE"

            echo "========================================"
            echo "5. Estado"
            echo "========================================"
            docker ps --filter name=phpmyadmin

            echo "✅ phpMyAdmin desplegado"
            echo "URL pública esperada: https://\${PMA_DOMAIN}"
            echo "Puerto local para Nginx: 127.0.0.1:\${PMA_PORT}"
          EOF
